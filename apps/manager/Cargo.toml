[package]
name = "action75-manager"
version = "0.4.3"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[[bin]]
name = "Action75Manager"
path = "src/main.rs"

[features]
update-qa = []

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg"] }
png = "=0.18.1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
raw-window-handle = "0.6"
wgpu = { version = "=27.0.1", default-features = false, features = ["dx12"] }
wgpu-types = { version = "=27.0.1", default-features = false }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_TaskScheduler", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Optimize cover decoding and resizing while keeping the rest of the UI small.
[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3
